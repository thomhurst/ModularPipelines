mode: ContinuousDeployment
# GitVersion only numbers validation builds (as alpha versions). Releases take their version from
# the tag of the published GitHub release (see .github/workflows/release-draft.yml), so commit
# messages such as +semver: no longer choose a version.
commit-message-incrementing: Disabled
strategies:
  - Mainline
ignore:
  sha: 
    - f7ef4687260996a62c4fed816462ab9592556115
    - 606fab3291986219f315be3940c910405420b3c6