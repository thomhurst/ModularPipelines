name: Version Tag

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  version-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Pipeline Project
        run: dotnet build src/ModularPipelines.Build/ModularPipelines.Build.csproj -c Release
      - name: Run Version Tag Pipeline
        run: dotnet run -c Release --framework net11.0 --no-build
        working-directory: "src/ModularPipelines.Build"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOTNET_ENVIRONMENT: Production
          Pipeline__RunOnlyCategories: VersionTag
          GitHub__StandardToken: ${{ github.token }}
