# Investigation branch only; never merge this diagnostic workflow into main.
name: .NET
on:
  workflow_dispatch:
    inputs:
      run-ids:
        description: Comma-separated workflow run and attempt identifiers
        type: string
        required: true
        default: "36266097739-1"
permissions:
  contents: read
jobs:
  redis-state:
    name: Read CI coordination metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect exact CI run namespaces
        env:
          CI_RUN_IDS: ${{ inputs.run-ids }}
          REDIS_ENDPOINT: ${{ secrets.REDIS_ENDPOINT }}
          REDIS_KEY: ${{ secrets.REDIS_KEY }}
        run: python3 scripts/Inspect-CiRedisState.py
