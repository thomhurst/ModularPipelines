name: .NET

on:
  push:
    branches: ["main"]
  # Generated refreshes also target feature branches and need the same validation gates.
  pull_request:
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?
        type: boolean
        required: true
        default: false
      distributed:
        description: Use Redis workers when credentials are available?
        type: boolean
        required: true
        default: true
      is-alpha:
        description: Alpha version?
        type: boolean
        required: true
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast-fail:
    name: Fast fail
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      distributed: ${{ steps.distribution.outputs.distributed }}
      matrix: ${{ steps.distribution.outputs.matrix }}
      run_identifier: ${{ steps.distribution.outputs.run_identifier }}
      run_full_pipeline: ${{ steps.full_pipeline.outputs.run_full_pipeline }}
      is_generated_integration: ${{ steps.generated_integration.outputs.is_generated_integration }}
      integration_tool: ${{ steps.generated_integration.outputs.tool }}
      integration_namespace_prefix: ${{ steps.generated_integration.outputs.namespace_prefix }}
      integration_package: ${{ steps.generated_integration.outputs.package }}
      integration_project: ${{ steps.generated_integration.outputs.project }}
      integration_test_project: ${{ steps.generated_integration.outputs.test_project }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect generated integration pull request
        id: generated_integration
        uses: ./.github/actions/detect-generated-integration
      - name: Detect core changes
        id: full_pipeline
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/Resolve-FullPipelineValidation.ps1 `
            -EventName $env:EVENT_NAME `
            -BaseSha $env:BASE_SHA `
            -HeadSha $env:HEAD_SHA `
            -GitHubOutput $env:GITHUB_OUTPUT
      - name: Resolve distributed matrix
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        id: distribution
        shell: pwsh
        env:
          REDIS_ENDPOINT: ${{ secrets.REDIS_ENDPOINT }}
          REDIS_KEY: ${{ secrets.REDIS_KEY }}
          ALLOW_DISTRIBUTED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.distributed) }}
        run: ./scripts/Resolve-DistributedBuildMatrix.ps1 -GitHubOutput $env:GITHUB_OUTPUT
      - name: Reject stale generated snapshots
        if: steps.generated_integration.outputs.is_generated_integration == 'true'
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          INTEGRATION_TOOL: ${{ steps.generated_integration.outputs.tool }}
          INTEGRATION_NAMESPACE_PREFIX: ${{ steps.generated_integration.outputs.namespace_prefix }}
          INTEGRATION_PACKAGE: ${{ steps.generated_integration.outputs.package }}
        run: |
          ./scripts/Assert-GeneratedOptionsFreshness.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Tool $env:INTEGRATION_TOOL `
            -Package $env:INTEGRATION_PACKAGE `
            -NamespacePrefix $env:INTEGRATION_NAMESPACE_PREFIX `
            -CurrentBase "origin/$($env:BASE_REF)"
      - name: Test generated integration validation routing
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: pwsh
        run: ./scripts/Test-ResolveGeneratedIntegrationValidation.ps1
      - name: Test required pipeline context routing
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: pwsh
        run: |
          ./scripts/Test-DistributedBuildMatrix.ps1
          ./scripts/Test-DistributedBuildSummary.ps1
          ./scripts/Test-FullPipelineValidation.ps1
          ./scripts/Test-RequiredPipelineContext.ps1
      - name: Test generated options provenance
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: pwsh
        run: ./scripts/Test-GeneratedOptionsProvenance.ps1
      - name: Test public API baseline checks
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: pwsh
        run: |
          ./scripts/Test-PublicApiRemovedMarker.ps1
          ./scripts/Test-AssertPublicApiBaselines.ps1
      - name: Verify public API baseline coverage
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: pwsh
        run: ./scripts/Assert-PublicApiBaselines.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ModularPipelines.Build/package-lock.json
      - name: Check Markdown formatting
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        working-directory: src/ModularPipelines.Build
        run: |
          npm ci
          npx --no-install remark ../../README.md ../../README_Template.md \
            --use remark-lint \
            --use remark-preset-lint-consistent \
            --use remark-preset-lint-recommended \
            --output
          git diff --exit-code -- ../../README.md ../../README_Template.md
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Validate pipeline template
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: bash
        run: |
          release_package_version=0.0.0-local
          framework_version="$release_package_version"
          dotnet pack src/ModularPipelines/ModularPipelines.csproj \
            -c Release \
            -p:PackageVersion="$release_package_version" \
            --output "$RUNNER_TEMP/template-pack"
          dotnet pack src/ModularPipelines.DotNet/ModularPipelines.DotNet.csproj \
            -c Release \
            -p:PackageVersion="$release_package_version" \
            --output "$RUNNER_TEMP/template-pack"
          dotnet pack src/ModularPipelines.Templates/ModularPipelines.Templates.csproj \
            -c Release \
            -p:PackageVersion="$release_package_version" \
            --output "$RUNNER_TEMP/template-pack"
          dotnet new install \
            "$RUNNER_TEMP/template-pack/ModularPipelines.Templates.$release_package_version.nupkg"
          dotnet new modularpipeline --help | grep -F -- '--no-restore'
          dotnet new modularpipeline \
            --name TemplateVersionSmoke \
            --output "$RUNNER_TEMP/template-version-smoke" \
            --no-restore
          test "$(grep -Fc "Version=\"$release_package_version\"" \
            "$RUNNER_TEMP/template-version-smoke/Directory.Packages.props")" -eq 2
          dotnet restore \
            "$RUNNER_TEMP/template-version-smoke/TemplateVersionSmoke.csproj" \
            -p:RestoreAdditionalProjectSources="$RUNNER_TEMP/template-pack" \
            -p:RestorePackagesPath="$RUNNER_TEMP/template-version-packages"
          export NUGET_PACKAGES="$RUNNER_TEMP/template-version-packages"
          dotnet build \
            "$RUNNER_TEMP/template-version-smoke/TemplateVersionSmoke.csproj" \
            -c Release \
            --no-restore
          dotnet new modularpipeline \
            --name TemplateSmoke \
            --output "$RUNNER_TEMP/template-smoke" \
            --solution ../Example.slnx \
            --publish-project ../src/Example/Example.csproj \
            --framework-version "$framework_version" \
            --no-restore
          grep -F '"Solution": "../Example.slnx"' \
            "$RUNNER_TEMP/template-smoke/appsettings.json"
          grep -F '"PublishProject": "../src/Example/Example.csproj"' \
            "$RUNNER_TEMP/template-smoke/appsettings.json"
          grep -F 'namespace TemplateSmoke.Modules;' \
            "$RUNNER_TEMP/template-smoke/Modules/BuildModule.cs"
          dotnet build "$RUNNER_TEMP/template-smoke/TemplateSmoke.csproj" -c Release
          dotnet new classlib \
            --name Example \
            --output "$RUNNER_TEMP/src/Example" \
            --no-restore
          dotnet new sln \
            --name Example \
            --output "$RUNNER_TEMP" \
            --format slnx
          dotnet sln "$RUNNER_TEMP/Example.slnx" \
            add "$RUNNER_TEMP/src/Example/Example.csproj"
          dotnet new modularpipeline \
            --name TemplateRun \
            --output "$RUNNER_TEMP/template-run" \
            --solution ../Example.slnx \
            --publish-project ../src/Example/Example.csproj \
            --framework-version "$framework_version" \
            --no-restore
          mkdir "$RUNNER_TEMP/template-caller"
          (
            cd "$RUNNER_TEMP/template-caller"
            dotnet run \
              --project "$RUNNER_TEMP/template-run/TemplateRun.csproj" \
              --configuration Release
          )
          test -f "$RUNNER_TEMP/template-run/artifacts/publish/Example.dll"
          test ! -d "$RUNNER_TEMP/template-caller/artifacts"
          dotnet publish \
            "$RUNNER_TEMP/template-run/TemplateRun.csproj" \
            --configuration Release \
            --output "$RUNNER_TEMP/template-published"
          cp -R \
            "$RUNNER_TEMP/template-run" \
            "$RUNNER_TEMP/relocated-template-run"
          rm -rf "$RUNNER_TEMP/relocated-template-run/artifacts"
          mkdir "$RUNNER_TEMP/published-caller"
          (
            cd "$RUNNER_TEMP/published-caller"
            MODULAR_PIPELINES_DIRECTORY="$RUNNER_TEMP/relocated-template-run" \
              dotnet "$RUNNER_TEMP/template-published/TemplateRun.dll"
          )
          test -f "$RUNNER_TEMP/relocated-template-run/artifacts/publish/Example.dll"
          test ! -d "$RUNNER_TEMP/published-caller/artifacts"
      - name: Run OptionsGenerator unit tests
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        run: |
          dotnet restore tools/ModularPipelines.OptionsGenerator/ModularPipelines.OptionsGenerator.slnx
          dotnet run \
            --project tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator.Tests/ModularPipelines.OptionsGenerator.Tests.csproj \
            --configuration Release \
            --framework net10.0 \
            --no-restore \
            -- \
            --coverage \
            --coverage-output-format cobertura \
            --hangdump \
            --hangdump-timeout 20m \
            --results-directory "$RUNNER_TEMP/options-generator-test-results" \
            --report-trx \
            --report-trx-filename test-results.trx
      - name: Verify generated global options
        if: steps.generated_integration.outputs.is_generated_integration != 'true'
        shell: pwsh
        run: tools/ModularPipelines.OptionsGenerator/scripts/Test-GeneratedGlobalOptions.ps1
      - name: Upload OptionsGenerator test results
        if: always() && steps.generated_integration.outputs.is_generated_integration != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: options-generator-test-results
          path: ${{ runner.temp }}/options-generator-test-results
          if-no-files-found: error
          retention-days: 1

  analyzers:
    name: analyzers
    needs: fast-fail
    if: ${{ always() && needs.fast-fail.outputs.run_full_pipeline == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EnableCiAnalyzers: "true"
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_gcServer: "0"

    steps:
      - name: Require fast-fail success
        if: needs.fast-fail.result != 'success'
        run: |
          echo "::error::The fast-fail lane did not pass."
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-analyzers-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-analyzers-
            ${{ runner.os }}-nuget-
      - name: Restore core solution
        run: dotnet restore ModularPipelines.slnx
      - name: Build core solution with analyzers
        # Report existing analyzer debt without failing; the next step gates warning-level
        # diagnostics in changed files so the baseline can only improve.
        run: >
          dotnet build ModularPipelines.slnx
          -c Release
          --no-restore
          -p:RunAnalyzers=true
          -p:RunAnalyzersDuringBuild=true
          -p:TreatWarningsAsErrors=false
      - name: Verify analyzer fixes in changed C# files
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $comparisonSha = $env:GITHUB_SHA

          if ($env:EVENT_NAME -eq 'pull_request') {
            $comparisonSha = $env:PR_HEAD_SHA
            $baseSha = git merge-base "origin/$($env:BASE_REF)" $comparisonSha
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseSha)) {
              Write-Error 'Unable to determine the pull request merge base.'
              exit 1
            }
          }
          else {
            $baseSha = $env:BEFORE_SHA
            if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match '^0+$') {
              $baseSha = 'HEAD^'
            }
          }

          $changedFiles = @(
            git diff --name-only --diff-filter=ACMRT $baseSha $comparisonSha -- '*.cs'
          )

          if ($changedFiles.Count -eq 0) {
            Write-Output 'No changed C# files require analyzer verification.'
            exit 0
          }

          $formatArguments = @(
            'format',
            'ModularPipelines.slnx',
            'analyzers',
            '--no-restore',
            '--verify-no-changes',
            '--severity',
            'warn',
            '--include'
          ) + $changedFiles

          $formatOutput = @(& dotnet @formatArguments 2>&1)
          $formatExitCode = $LASTEXITCODE
          $formatOutput | ForEach-Object { Write-Output $_ }

          if ($formatExitCode -eq 0) {
            exit 0
          }

          $normalizedChangedFiles = @(
            $changedFiles | ForEach-Object { $_.Replace('\', '/') }
          )
          $diagnosticLines = @(
            $formatOutput | Where-Object {
              $_.ToString().Replace('\', '/') -match '\.cs\(\d+,\d+\): (error|warning) '
            }
          )
          $relevantDiagnostics = @(
            foreach ($line in $diagnosticLines) {
              $normalizedLine = $line.ToString().Replace('\', '/')
              foreach ($changedFile in $normalizedChangedFiles) {
                if ($normalizedLine.Contains("/$changedFile(", [System.StringComparison]::OrdinalIgnoreCase)) {
                  $normalizedLine
                  break
                }
              }
            }
          )

          if ($relevantDiagnostics.Count -gt 0) {
            Write-Error 'Analyzer diagnostics were found in changed C# files.'
            exit 1
          }

          if ($diagnosticLines.Count -eq 0) {
            Write-Error "dotnet format failed without analyzer diagnostics (exit code $formatExitCode)."
            exit $formatExitCode
          }

          Write-Output 'Only pre-existing diagnostics outside changed C# files were found.'

  pipeline-host:
    name: Build portable pipeline host
    needs: fast-fail
    if: needs.fast-fail.outputs.run_full_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Identical assemblies give every worker the same module/schema identity.
      # Run these files outside the checkout so Windows can rebuild the Build project.
      - name: Publish portable host
        shell: bash
        run: dotnet publish src/ModularPipelines.Build/ModularPipelines.Build.csproj -c Release --framework net10.0 --no-self-contained -p:UseAppHost=false -o "$RUNNER_TEMP/pipeline-host"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-host
          path: ${{ runner.temp }}/pipeline-host
          retention-days: 1

  pipeline:
    name: full pipeline (${{ matrix.os }}, instance ${{ matrix.instance }})
    needs: [fast-fail, pipeline-host]
    # Only core-related changes need the full suite, on both PRs and main pushes.
    # Manual dispatch always runs the suite, including package publishing.
    if: ${{ !cancelled() && needs.fast-fail.outputs.run_full_pipeline == 'true' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    strategy:
      matrix: ${{ fromJSON(needs.fast-fail.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 90
    env:
      # Tear down MSBuild worker/compiler nodes after each build instead of keeping them
      # resident. BuildSolutionsModule builds several solutions in sequence; with node reuse
      # the persistent nodes accumulate memory across those builds, which contributed to the
      # runner reclaim in #3179. Disabling reuse keeps peak memory bounded per build.
      MSBUILDDISABLENODEREUSE: "1"
      # Workstation GC keeps the build/test footprint lower than server GC (which allocates a
      # heap per core) on these multi-core runners.
      DOTNET_gcServer: "0"
      # Markdown and OptionsGenerator tests passed in the prerequisite job.
      FAST_FAIL_VALIDATED: "true"

    steps:
      # Keep the existing required check red when the prerequisite fails. A job skipped
      # through `needs` is considered successful by GitHub branch protection.
      - name: Require fast-fail success
        if: needs.fast-fail.result != 'success' || needs.pipeline-host.result != 'success'
        run: |
          echo "::error::The fast-fail lane or portable host build did not pass."
          exit 1
      - name: Validate retry scope
        if: needs.fast-fail.outputs.distributed == 'true'
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ needs.fast-fail.outputs.run_identifier }}
        run: |
          if [[ "$EXPECTED_RUN_ID" != "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            echo "::error::Distributed workflows require Re-run all jobs; partial retries cannot recreate the worker matrix."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download portable pipeline host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pipeline-host
          path: ${{ runner.temp }}/pipeline-host
      - name: Restore OptionsGenerator test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: options-generator-test-results
          path: tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator.Tests/bin/Release/net10.0/TestResults
      - name: Increase swap space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Two consecutive builds exhausted the hosted runner while compiling
          # ModularPipelines.Examples.slnx after the full solution (MSB4166).
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        shell: bash
        run: |
          while IFS= read -r SOLUTION || [[ -n "$SOLUTION" ]]
          do
            [[ -z "$SOLUTION" || "$SOLUTION" == \#* ]] && continue
            dotnet restore "$SOLUTION"
          done < <(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' BuildSolutions.txt)

      - name: Build solutions
        if: needs.fast-fail.outputs.distributed != 'true'
        shell: bash
        # Compile every solution here, in a native build step, BEFORE the pipeline runs.
        # The pipeline reuses these outputs through Pipeline__BuildAlreadyCompleted rather
        # than evaluating every solution a second time inside the long-lived process (#3179).
        # Default MSBuild parallelism is intentional: the runner reclaim came from a test project that
        # referenced every integration at once (to snapshot all generated options), which pulled
        # the huge AWS/Azure/Google SDK metadata into one compilation unit. That test was removed,
        # so each integration now compiles with only its own SDK and the parallel build fits.
        run: |
          while IFS= read -r SOLUTION || [[ -n "$SOLUTION" ]]
          do
            [[ -z "$SOLUTION" || "$SOLUTION" == \#* ]] && continue
            echo "::group::Build $SOLUTION"
            dotnet build "$SOLUTION" -c Release --no-restore
            echo "::endgroup::"
          done < <(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' BuildSolutions.txt)

      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish-packages == 'true' && matrix.instance == 0 }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Pipeline
        shell: bash
        run: |
          # version-tag.yml exclusively owns tags for main pushes. With no standard token,
          # SkipIfNoStandardGitHubToken prevents this pipeline from creating a second tag.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            unset GitHub__StandardToken
          fi

          dotnet "$RUNNER_TEMP/pipeline-host/ModularPipelines.Build.dll"
        working-directory: "src/ModularPipelines.Build"
        env:
          Pipeline__BuildAlreadyCompleted: ${{ needs.fast-fail.outputs.distributed != 'true' }}
          MODULAR_PIPELINES_DIRECTORY: ${{ github.workspace }}/src/ModularPipelines.Build
          GITHUB_TOKEN: ${{ github.token }}
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          GitHub__Actor: ${{ github.actor }}
          GitHub__Repository__Id: ${{ github.repository_id }}
          GitHub__StandardToken: ${{ matrix.instance == 0 && secrets.DOTNET_FORMAT_PUSH_TOKEN || '' }}
          GitHub__AdminToken: ${{ matrix.instance == 0 && secrets.ADMIN_TOKEN || '' }}
          Publish__ShouldPublish: ${{ github.ref == 'refs/heads/main' && inputs.publish-packages == true && matrix.instance == 0 }}
          Publish__IsAlpha: ${{ github.event.inputs.is-alpha || true }}
          Codacy__ApiKey: ${{ matrix.instance == 0 && secrets.CODACY_APIKEY || '' }}
          CodeCov__Token: ${{ matrix.instance == 0 && secrets.CODECOV_TOKEN || '' }}
          EMAIL_PASSWORD: ${{ matrix.instance == 0 && secrets.EMAIL_PASSWORD || '' }}
          MODULARPIPELINES_INSTANCE_INDEX: ${{ matrix.instance }}
          MODULARPIPELINES_TOTAL_INSTANCES: ${{ matrix.total }}
          MODULARPIPELINES_RUN_ID: ${{ needs.fast-fail.outputs.run_identifier }}
          REDIS_ENDPOINT: ${{ needs.fast-fail.outputs.distributed == 'true' && secrets.REDIS_ENDPOINT || '' }}
          REDIS_KEY: ${{ needs.fast-fail.outputs.distributed == 'true' && secrets.REDIS_KEY || '' }}

      - name: Summarize pipeline efficiency
        if: always() && matrix.instance == 0 && steps.checkout.outcome == 'success'
        shell: pwsh
        run: ./scripts/Write-DistributedBuildSummary.ps1 -ReportPath artifacts/run-report.json -SummaryPath $env:GITHUB_STEP_SUMMARY
      - name: Upload pipeline report
        if: always() && matrix.instance == 0
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-report-${{ matrix.instance }}-${{ matrix.os }}
          path: artifacts/run-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Hang Dumps
        if: always() && needs.fast-fail.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-${{ matrix.instance }}-${{ matrix.os }}
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Unit Test Results
        if: always() && needs.fast-fail.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.instance }}-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/TestResults/Diagnostics/*.diag
          if-no-files-found: ignore
          retention-days: 7

  cross-platform-build:
    name: build (${{ matrix.os }})
    needs: fast-fail
    # Secretless builds retain Windows/macOS compilation outside the standalone host.
    if: ${{ !cancelled() && needs.fast-fail.outputs.run_full_pipeline == 'true' && needs.fast-fail.outputs.distributed != 'true' }}
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_gcServer: "0"

    # Compile only: running ModularPipelines.Build while it builds the listed solutions
    # would lock its own executable on Windows (MSB3027).
    steps:
      - name: Require fast-fail success
        if: needs.fast-fail.result != 'success'
        run: |
          echo "::error::The fast-fail lane did not pass."
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore and build solutions
        shell: pwsh
        run: |
          $solutions = Get-Content BuildSolutions.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }

          foreach ($solution in $solutions) {
            Write-Output "::group::Restore $solution"
            dotnet restore $solution /m:1
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Write-Output "::endgroup::"

            Write-Output "::group::Build $solution"
            # Bound compiler memory while compiling large generated integrations.
            dotnet build $solution -c Release --no-restore /m:1 -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Write-Output "::endgroup::"
          }

  generated-integration:
    name: generated integration (${{ needs.fast-fail.outputs.integration_package }})
    needs: fast-fail
    if: ${{ always() && needs.fast-fail.outputs.is_generated_integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_gcServer: "0"

    steps:
      - name: Require fast-fail success
        if: needs.fast-fail.result != 'success'
        run: |
          echo "::error::The fast-fail lane did not pass."
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-generated-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-generated-
            ${{ runner.os }}-nuget-
      - name: Increase swap space for generated gcloud validation
        if: needs.fast-fail.outputs.integration_package == 'ModularPipelines.Google'
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: Build and test changed integration
        shell: bash
        env:
          INTEGRATION_PACKAGE: ${{ needs.fast-fail.outputs.integration_package }}
          INTEGRATION_PROJECT: ${{ needs.fast-fail.outputs.integration_project }}
          TEST_PROJECT: ${{ needs.fast-fail.outputs.integration_test_project }}
        run: |
          BUILD_ARGS=()
          if [[ "$INTEGRATION_PACKAGE" == "ModularPipelines.Google" ]]; then
            BUILD_ARGS+=(/m:1 -p:UseSharedCompilation=false)
          fi
          # Project references compile the shared core and source generators automatically.
          dotnet build "$INTEGRATION_PROJECT" -c Release "${BUILD_ARGS[@]}"

          if [[ -n "$TEST_PROJECT" ]]; then
            dotnet build "$TEST_PROJECT" -c Release "${BUILD_ARGS[@]}"
            dotnet run --project "$TEST_PROJECT" -c Release --framework net10.0 --no-build
          fi

  required-pipeline:
    # Stable branch-protection check for full, generated, or fast-fail-only validation.
    name: pipeline (ubuntu-latest)
    needs: [fast-fail, pipeline, generated-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/Assert-RequiredPipelineContext.ps1
          sparse-checkout-cone-mode: false
      - name: Validate required pipeline result
        shell: pwsh
        run: |
          ./scripts/Assert-RequiredPipelineContext.ps1 `
            -RunFullPipeline '${{ needs.fast-fail.outputs.run_full_pipeline }}' `
            -IsGeneratedIntegration '${{ needs.fast-fail.outputs.is_generated_integration }}' `
            -FastFailResult '${{ needs.fast-fail.result }}' `
            -FullPipelineResult '${{ needs.pipeline.result }}' `
            -GeneratedIntegrationResult '${{ needs.generated-integration.result }}'

  trim-aot:
    name: trim and Native AOT
    needs: fast-fail
    if: ${{ always() && needs.fast-fail.outputs.run_full_pipeline == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_gcServer: "0"

    steps:
      - name: Require fast-fail success
        if: needs.fast-fail.result != 'success'
        run: |
          echo "::error::The fast-fail lane did not pass."
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-trim-aot-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-trim-aot-
            ${{ runner.os }}-nuget-
      - name: Publish and run trimmed smoke
        shell: bash
        run: |
          dotnet publish \
            test/ModularPipelines.TrimAotSmoke/ModularPipelines.TrimAotSmoke.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$RUNNER_TEMP/trim-smoke" \
            -p:PublishAot=false
          "$RUNNER_TEMP/trim-smoke/ModularPipelines.TrimAotSmoke" |
            grep -F TRIM_AOT_SMOKE_OK
      - name: Publish and run Native AOT smoke
        shell: bash
        run: |
          dotnet publish \
            test/ModularPipelines.TrimAotSmoke/ModularPipelines.TrimAotSmoke.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$RUNNER_TEMP/aot-smoke"
          "$RUNNER_TEMP/aot-smoke/ModularPipelines.TrimAotSmoke" |
            grep -F TRIM_AOT_SMOKE_OK
