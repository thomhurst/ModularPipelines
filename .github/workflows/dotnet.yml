# Investigation branch only; never merge this diagnostic workflow into main.
name: .NET
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redis-state:
    name: Read CI coordination metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect exact CI run namespaces
        env:
          REDIS_ENDPOINT: ${{ secrets.REDIS_ENDPOINT }}
          REDIS_KEY: ${{ secrets.REDIS_KEY }}
        run: python3 scripts/Inspect-CiRedisState.py
