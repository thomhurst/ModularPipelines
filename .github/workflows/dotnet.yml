# Investigation branch only; do not merge this profiling workflow into main.
name: .NET

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-profile:
    name: macOS AWS build (${{ matrix.gc }})
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        gc: [default, workstation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Record runner and compiler configuration
        shell: bash
        run: |
          dotnet --info
          sysctl hw.memsize vm.swapusage
          sdk_version="$(dotnet --version)"
          sdk_directory="$(dotnet --list-sdks | sed -n "s/^${sdk_version} \[\(.*\)\]$/\1/p")"
          cat "${sdk_directory}/${sdk_version}/Roslyn/bincore/csc.runtimeconfig.json"
      - name: Restore AWS integration
        run: dotnet restore src/ModularPipelines.AmazonWebServices/ModularPipelines.AmazonWebServices.slnx
      - name: Measure AWS compilation
        shell: bash
        env:
          GC_MODE: ${{ matrix.gc }}
        run: |
          if [[ "$GC_MODE" == workstation ]]; then
            export DOTNET_gcServer=0
            unset COMPlus_gcServer
          else
            unset DOTNET_gcServer COMPlus_gcServer
          fi
          status=0
          /usr/bin/time -l dotnet build src/ModularPipelines.AmazonWebServices/ModularPipelines.AmazonWebServices.slnx \
            -c Release --no-restore /m:1 -p:UseSharedCompilation=false -p:ReportAnalyzer=true \
            2>&1 | tee "compiler-${GC_MODE}.log" || status=$?
          sysctl vm.swapusage | tee -a "compiler-${GC_MODE}.log"
          exit "$status"
      - name: Preserve measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-build-profile-${{ matrix.gc }}-${{ github.run_attempt }}
          path: compiler-*.log
          if-no-files-found: warn
          retention-days: 14
