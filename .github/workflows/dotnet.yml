name: .NET

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?
        type: boolean
        required: true
        default: false
      is-alpha:
        description: Alpha version?
        type: boolean
        required: true
        default: true

jobs:
  pipeline:
    name: ${{ matrix.check_name }}
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    strategy:
      # Single standalone (non-distributed) Linux job. Distributed mode relied on Redis
      # (Upstash) discovery + a SignalR/cloudflared mesh; with Redis unavailable it fell back
      # to one overloaded instance doing the whole build+test load, which the runner kept
      # reclaiming (see #3179). Windows/macOS can't run this standalone either: their
      # BuildSolutionOn*Module builds ModularPipelines.All.sln, which includes the running
      # ModularPipelines.Build executable, so the build fails to overwrite its own locked
      # binary (MSB3027, see #3084). The unit tests are Linux-only, so a single ubuntu job
      # covers the real work; cross-platform build coverage can be reintroduced separately.
      matrix:
        include:
          - os: ubuntu-latest
            check_name: pipeline (ubuntu-latest)
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Bound the job so a stuck pipeline fails fast instead of tying up a runner for the
    # default 6 hours. The "Upload Hang Dumps" step runs on if:always() so dumps are
    # still collected when this timeout trips.
    timeout-minutes: 60
    env:
      # Tear down MSBuild worker/compiler nodes after each build instead of keeping them
      # resident. BuildSolutionsModule builds several solutions in sequence; with node reuse
      # the persistent nodes accumulate memory across those builds, which contributed to the
      # runner reclaim in #3179. Disabling reuse keeps peak memory bounded per build.
      MSBUILDDISABLENODEREUSE: "1"
      # Workstation GC keeps the build/test footprint lower than server GC (which allocates a
      # heap per core) on these multi-core runners.
      DOTNET_gcServer: "0"

    steps:
      - name: Add mask
        run: |
          echo "::add-mask::${{ secrets.DOTNET_FORMAT_PUSH_TOKEN }}"
          echo "::add-mask::${{ secrets.NuGet__ApiKey }}"
          echo "::add-mask::${{ secrets.ADMIN_TOKEN }}"
          echo "::add-mask::${{ secrets.CODACY_APIKEY }}"
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Increase swap space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Extra headroom for the full-solution build on the Linux runner.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory and swap after reconfiguration:"
          free -h
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        shell: bash
        run: |
          for SOLUTION in ModularPipelines.Analyzers.sln ModularPipelines.All.sln ModularPipelines.Examples.sln src/ModularPipelines.Azure/ModularPipelines.Azure.sln src/ModularPipelines.AmazonWebServices/ModularPipelines.AmazonWebServices.sln src/ModularPipelines.Google/ModularPipelines.Google.sln
          do
            dotnet restore $SOLUTION
          done

      - name: Build solutions
        shell: bash
        # Compile every solution here, in a native build step, BEFORE the pipeline runs.
        # A native `dotnet build` streams progress and reports a clear pass/fail, exactly
        # like the CodeQL "Analyze (csharp)" step which builds the same code without the
        # runner being reclaimed. Doing the heavy compile out-of-process means the
        # pipeline's own BuildSolutionsModule finds everything already built (it runs with
        # --no-restore and MSBuild incremental, so it becomes a fast no-op) instead of
        # doing the large All.sln compile inside the long-lived pipeline process that kept
        # getting the Linux runner reclaimed (#3179). It also isolates the diagnosis: if
        # the build passes here but the pipeline still fails, the cause is test execution,
        # not the build.
        run: |
          for SOLUTION in ModularPipelines.Analyzers.sln ModularPipelines.All.sln ModularPipelines.Examples.sln src/ModularPipelines.Azure/ModularPipelines.Azure.sln src/ModularPipelines.AmazonWebServices/ModularPipelines.AmazonWebServices.sln src/ModularPipelines.Google/ModularPipelines.Google.sln
          do
            echo "::group::Build $SOLUTION"
            dotnet build "$SOLUTION" -c Release --no-restore
            echo "::endgroup::"
          done

      - name: Run Pipeline
        run: dotnet run -c Release --framework net10.0
        working-directory: "src/ModularPipelines.Build"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ github.ref == 'refs/heads/main' && secrets.NuGet__ApiKey || null }}
          GitHub__Actor: ${{ github.actor }}
          GitHub__Repository__Id: ${{ github.repository_id }}
          GitHub__StandardToken: ${{ secrets.DOTNET_FORMAT_PUSH_TOKEN }}
          GitHub__AdminToken: ${{ secrets.ADMIN_TOKEN }}
          Publish__ShouldPublish: ${{ (github.event.inputs.publish-packages || false) && matrix.os == 'ubuntu-latest' }}
          Publish__IsAlpha: ${{ github.event.inputs.is-alpha || true }}
          Codacy__ApiKey: ${{ secrets.CODACY_APIKEY }}
          CodeCov__Token: ${{ secrets.CODECOV_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Standalone (non-distributed): TOTAL_INSTANCES=1 makes the pipeline skip the
          # Redis/SignalR discovery path entirely and run everything on this single runner.
          # Re-enabling distribution also requires restoring Redis/R2 credentials and the
          # cloudflared install because Program.cs configures EnableTunnel=true.
          INSTANCE_INDEX: 0
          TOTAL_INSTANCES: 1

      - name: Upload Hang Dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-${{ matrix.os }}
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7
