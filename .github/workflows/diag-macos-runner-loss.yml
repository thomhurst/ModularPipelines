# Temporary diagnostic workflow for #5926: compares the runtime's process-tree kill with
# ModularPipelines' ProcessTree.Kill workaround on macOS arm64 runners.
name: Diag macOS runner loss

on:
  push:
    branches: ["diag/macos-runner-loss"]

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.mode }} (${{ matrix.attempt }})
    runs-on: macos-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [runtime, workaround]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Kill 200 process trees
        timeout-minutes: 5
        run: dotnet run diag/repro.cs -- ${{ matrix.mode }}
