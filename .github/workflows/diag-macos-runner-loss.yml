# Temporary diagnostic workflow for #5926: loops the macOS-flaky process fixture tests on main
# and on the fix branch.
name: Diag macOS runner loss

on:
  push:
    branches: ["diag/macos-runner-loss"]

permissions:
  contents: read

jobs:
  flake:
    name: ${{ matrix.ref }} (${{ matrix.attempt }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [main, fix/5926-log-process-tree-kills]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build core tests
        run: dotnet build ModularPipelines.Tests.slnf --configuration Release -p:UseSharedCompilation=false
      - name: Loop process fixture tests
        shell: bash
        run: |
          failures=0
          for i in $(seq 1 30); do
            if ! dotnet run --configuration Release --framework net10.0 --no-build \
                --project test/ModularPipelines.UnitTests/ModularPipelines.UnitTests.csproj -- \
                --treenode-filter "/*/*/CommandTests/ProcessTreeFixture_Reads_Identity_While_Publication_Handle_Is_Open" > "run-$i.log" 2>&1; then
              failures=$((failures+1)); echo "iteration $i FAILED"; grep -m3 -E "failed|Exception" "run-$i.log"
            fi
          done
          echo "RESULT ${{ matrix.ref }}: $failures of 30 failed"
