# Temporary diagnostic workflow for #5926: tests whether the macOS runner dies because a
# process-group kill reaches the runner, and probes proc_listchildpids return values.
name: Diag macOS runner loss

on:
  push:
    branches: ["diag/macos-runner-loss"]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: probe proc_listchildpids
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          echo "pgid of this shell: $(ps -o pgid= -p $$)  runner listener: $(pgrep -f Runner.Listener | xargs -I{} ps -o pid=,pgid= -p {})"
          sleep 30 & sleep 30 & sleep 30 &
          python3 - <<'PY'
          import ctypes, os
          lib = ctypes.CDLL("/usr/lib/libproc.dylib")
          f = lib.proc_listchildpids
          f.argtypes = [ctypes.c_int, ctypes.c_void_p, ctypes.c_int]
          ppid = os.getppid()
          n = f(ppid, None, 0)
          print("null-buffer return:", n)
          buf = (ctypes.c_int * max(n, 1))()
          m = f(ppid, buf, ctypes.sizeof(buf))
          print("filled return:", m, "buffer:", list(buf)[:max(n,1)])
          PY

  repro:
    name: command tests (${{ matrix.attempt }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    env:
      MSBUILDDISABLENODEREUSE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Start detached sampler
        shell: bash
        run: |
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/5926/comments" \
            -f body="pgkill repro ${{ matrix.attempt }} (run ${GITHUB_RUN_ID}): starting" --jq .id)
          cat > "$RUNNER_TEMP/sample.sh" <<'EOF'
          #!/bin/bash
          log="$RUNNER_TEMP/samples.log"
          echo "sampler pid $$ pgid $(ps -o pgid= -p $$) listener $(pgrep -f Runner.Listener | xargs -I{} ps -o pid=,pgid= -p {})" >> "$log"
          while true; do
            echo "=== $(date -u +%H:%M:%S) phase=$(cat "$RUNNER_TEMP/phase" 2>/dev/null) listener=$(pgrep -f Runner.Listener || echo DEAD) worker=$(pgrep -f Runner.Worker || echo DEAD) testhost=$(pgrep -f ModularPipelines.UnitTests | tr '\n' ',')" >> "$log"
            body=$(printf 'pgkill repro %s (run %s):\n```\n%s\n```' "$ATTEMPT" "$GITHUB_RUN_ID" "$(tail -n 40 "$log")")
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$1" -f body="$body" > /dev/null 2>&1 &
            sleep 2
          done
          EOF
          chmod +x "$RUNNER_TEMP/sample.sh"
          # Own session and process group, so a process-group kill from the tests cannot reach it.
          ATTEMPT=${{ matrix.attempt }} python3 -c 'import os,sys; os.setsid(); os.execv(sys.argv[1], sys.argv[1:])' "$RUNNER_TEMP/sample.sh" "$comment_id" > /dev/null 2>&1 &
          echo "build" > "$RUNNER_TEMP/phase"
      - name: Build core tests
        run: dotnet build ModularPipelines.Tests.slnf --configuration Release -p:UseSharedCompilation=false
      - name: Run process-tree command tests only
        shell: bash
        run: |
          echo "test" > "$RUNNER_TEMP/phase"
          for i in 1 2 3 4 5; do
            echo "test-loop-$i" > "$RUNNER_TEMP/phase"
            dotnet run --configuration Release --framework net10.0 \
              --project test/ModularPipelines.UnitTests/ModularPipelines.UnitTests.csproj --no-build -- \
              --treenode-filter "/*/*/CommandTests/*" || true
          done
          echo "done" > "$RUNNER_TEMP/phase"
