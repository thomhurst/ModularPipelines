# Temporary diagnostic workflow for #5926 / dotnet/runtime#131944: freezes a macOS runner with
# Process.Kill(entireProcessTree: true) and captures process state, stacks and a dump from a
# root watchdog outside the job's process tree.
name: Diag macOS runner loss

on:
  push:
    branches: ["diag/macos-runner-loss"]

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure diagnostics prerelease exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view diag-runtime-131944 -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create diag-runtime-131944 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease               --title "Diagnostics: dotnet/runtime#131944 macOS process-tree kill freeze"               --notes "Temporary diagnostics for dotnet/runtime#131944 and #5926. Not a release."

  capture:
    needs: release
    name: capture ${{ matrix.group }} (${{ matrix.attempt }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
        group: [shared, setsid]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build repro
        run: |
          dotnet --info | head -20
          dotnet build diag/hang.cs -c Release -o "$RUNNER_TEMP/hang"
      - name: Start root watchdog outside the job tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x diag/watchdog.sh
          label="capture-${{ matrix.group }}-${{ matrix.attempt }}-${GITHUB_RUN_ID}"
          sudo --preserve-env=GH_TOKEN,GITHUB_REPOSITORY,GITHUB_RUN_ID python3 -c '
          import os, sys
          if os.fork(): sys.exit(0)
          os.setsid()
          if os.fork(): sys.exit(0)
          fd = os.open("/dev/null", os.O_RDWR)
          for i in (0, 1, 2): os.dup2(fd, i)
          os.execv(sys.argv[1], sys.argv[1:])
          ' "$PWD/diag/watchdog.sh" "$RUNNER_TEMP/heartbeat.txt" "/tmp/diag-out" "diag-runtime-131944" "$label" "$DOTNET_ROOT"
          sleep 2; ps -axo pid,ppid,user,command | grep [w]atchdog
      - name: Show ancestor process groups
        run: |
          pid=$$
          while [ "$pid" -gt 1 ]; do ps -o pid=,ppid=,pgid=,sess=,user=,command= -p "$pid" | cut -c1-150; pid=$(ps -o ppid= -p "$pid" | tr -d ' '); done
      - name: Run repro with a minimal environment
        timeout-minutes: 6
        env:
          GROUP: ${{ matrix.group }}
        run: |
          cmd=(env -i PATH="$PATH" HOME="$HOME" TMPDIR="$TMPDIR" DOTNET_ROOT="$DOTNET_ROOT"
            dotnet "$RUNNER_TEMP/hang/hang.dll" "$RUNNER_TEMP/heartbeat.txt")
          if [ "$GROUP" = "setsid" ]; then
            # New session and process group; the step waits for the repro to finish.
            python3 -c 'import os, sys; os.setsid(); os.execvp(sys.argv[1], sys.argv[1:])' "${cmd[@]}" || echo "repro exited with $?"
          else
            "${cmd[@]}"
          fi
          echo "runner still alive after repro"
          tail -3 "$RUNNER_TEMP/heartbeat.txt"
