name: Generate CLI Options

on:
  schedule:
    # Run on the first day of every month at 2:00 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      # Specify which tools to run (comma-separated). Leave empty to run all tools.
      tools:
        description: 'Tools to run (comma-separated, empty = all). Example: helm,kubectl,docker'
        required: false
        default: ''
        type: string
      create-pr:
        description: 'Create a pull request with changes'
        required: false
        default: true
        type: boolean
      approve-command-coverage-shrinkage:
        description: 'Approve same-version changes and at most five undocumented removals; larger removals need reasoned exclusions, and minimum/sentinel checks remain enforced'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-generation-safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test generation download verification
        shell: pwsh
        run: .github/scripts/Test-GenerationToolDownloads.ps1
      - name: Test publication artifact boundary
        run: node --test .github/scripts/generation-artifact.test.mjs
      - name: Test exact generated-file staging
        shell: pwsh
        run: tools/ModularPipelines.OptionsGenerator/scripts/Test-StageGeneratedChanges.ps1
      - name: Test pruning of obsolete generated options
        shell: pwsh
        run: tools/ModularPipelines.OptionsGenerator/scripts/Test-UnrecognizedCommandOptions.ps1
      - name: Reject stale generated enum attributes
        shell: pwsh
        run: tools/ModularPipelines.OptionsGenerator/scripts/Test-GeneratedEnumAttributes.ps1

  tool-catalog:
    needs: validate-generation-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      linux: ${{ steps.catalog.outputs.linux }}
      linux-count: ${{ steps.catalog.outputs.linux-count }}
      windows: ${{ steps.catalog.outputs.windows }}
      windows-count: ${{ steps.catalog.outputs.windows-count }}
      publication: ${{ steps.catalog.outputs.publication }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build generator
        run: >-
          dotnet build
          tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator/ModularPipelines.OptionsGenerator.csproj
          -c Release
      - name: Create generation matrices
        id: catalog
        env:
          TOOLS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tools || '' }}
        run: |
          dotnet run --no-build \
            --project tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator/ModularPipelines.OptionsGenerator.csproj \
            -c Release -- \
            --list-tools --json > "$RUNNER_TEMP/tool-catalog.json"

          SELECTED_TOOLS="$(
            jq -cn --arg tools "$TOOLS_INPUT" \
              '$tools | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
          )"

          create_matrix() {
            jq -c --arg platform "$1" --argjson selected "$SELECTED_TOOLS" \
              '{include: [.[] | .toolName as $tool | select(
                .generationPlatform == $platform
                and .includeInGenerationMatrix
                and (($selected | length) == 0 or ($selected | index($tool)) != null)
              ) | {
                tool: .toolName,
                package: .packageName,
                prefix: .namespacePrefix,
                outputDirectory: .outputDirectory,
                generateCommandFacade: .generateCommandFacade,
                maximumFileSizeBytes: (if .generationPlatform == "windows" then 5242880 else 26214400 end),
                timeoutMinutes: (if .toolName == "aws" then 150 elif .toolName == "gcloud" then 90 else 60 end)
              }]}' \
              "$RUNNER_TEMP/tool-catalog.json"
          }

          LINUX_MATRIX="$(create_matrix linux)"
          WINDOWS_MATRIX="$(create_matrix windows)"
          jq -en \
            --argjson linux "$LINUX_MATRIX" \
            --argjson windows "$WINDOWS_MATRIX" \
            '(($linux.include | length) + ($windows.include | length)) > 0'
          {
            echo "linux=$LINUX_MATRIX"
            echo "linux-count=$(jq '.include | length' <<< "$LINUX_MATRIX")"
            echo "windows=$WINDOWS_MATRIX"
            echo "windows-count=$(jq '.include | length' <<< "$WINDOWS_MATRIX")"
            echo "publication=$(jq -cn --argjson linux "$LINUX_MATRIX" --argjson windows "$WINDOWS_MATRIX" '{include: ($linux.include + $windows.include)}')"
          } >> "$GITHUB_OUTPUT"

  # Generate options for each tool in parallel (Linux)
  generate:
    name: Generate ${{ matrix.tool }}
    needs:
      - validate-generation-safety
      - tool-catalog
    if: needs.tool-catalog.outputs.linux-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tool-catalog.outputs.linux) }}
    concurrency:
      group: ${{ github.workflow }}-generated-refresh-${{ matrix.tool }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check if tool should run
        id: should-run
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.should-run.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        if: steps.should-run.outputs.run == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet
        if: steps.should-run.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare isolated CLI workspace
        if: steps.should-run.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cli-tools/bin" "$RUNNER_TEMP/generator-work"
          if [ "${{ matrix.tool }}" = "dotnet" ]; then
            cp "$GITHUB_WORKSPACE/global.json" "$RUNNER_TEMP/generator-work/global.json"
          fi
          echo "CLI_TOOLS_ROOT=$RUNNER_TEMP/cli-tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cli-tools/bin" >> "$GITHUB_PATH"

      # Clean up legacy manual files before generation
      # Only delete specific service interface/implementation files that will be replaced
      - name: Clean up legacy files
        id: package
        if: steps.should-run.outputs.run == 'true'
        run: |
          PACKAGE="${{ matrix.package }}"
          PREFIX="${{ matrix.prefix }}"
          PKG_DIR="${{ matrix.outputDirectory }}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          echo "Cleaning up legacy files in $PKG_DIR for prefix $PREFIX..."
          LEGACY_PATHS="$RUNNER_TEMP/legacy-generated-paths.txt"
          : > "$LEGACY_PATHS"

          remove_legacy_file() {
            if [ -e "$1" ]; then
              printf '%s\n' "$1" >> "$LEGACY_PATHS"
              rm -f "$1"
            fi
          }

          # Preserve handwritten service APIs during coverage-only generator runs.
          if [ "${{ matrix.generateCommandFacade }}" = "true" ]; then
            # Only delete specific service interface/implementation files (not all I*.cs files)
            # These are the exact files the generator will create in Services/
            remove_legacy_file "$PKG_DIR/I${PREFIX}.cs"
            remove_legacy_file "$PKG_DIR/${PREFIX}.cs"

            # Keep generated service files until generation succeeds. They are the API
            # baseline used to restore commands that disappeared from newer CLI help,
            # and successful generation overwrites these exact paths atomically.
          fi

          echo "Cleanup complete for $PACKAGE"

      # Install CLI tools needed for CLI-first scraping
      - name: Install Helm
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'helm'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool helm -Destination "$RUNNER_TEMP/helm.tar.gz"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$CLI_TOOLS_ROOT/bin" --strip-components=1 linux-amd64/helm

      - name: Install kubectl
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'kubectl'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool kubectl -Destination "$CLI_TOOLS_ROOT/bin/kubectl"
          chmod +x "$CLI_TOOLS_ROOT/bin/kubectl"

      - name: Install Azure CLI
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'az'
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/modularpipelines-azure-config
          AZURE_EXTENSION_DIR: ${{ runner.temp }}/modularpipelines-azure-extensions
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool az -Destination "$RUNNER_TEMP/azure-cli.deb"
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades "$RUNNER_TEMP/azure-cli.deb"
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool azure-devops -Destination "$RUNNER_TEMP/azure_devops-1.0.9-py2.py3-none-any.whl"
          # Only install the verified DevOps extension, independent of runner state.
          az extension add --source "$RUNNER_TEMP/azure_devops-1.0.9-py2.py3-none-any.whl" --yes --only-show-errors
          {
            echo "AZURE_CONFIG_DIR=$AZURE_CONFIG_DIR"
            echo "AZURE_EXTENSION_DIR=$AZURE_EXTENSION_DIR"
            echo "AZURE_EXTENSION_USE_DYNAMIC_INSTALL=no"
          } >> "$GITHUB_ENV"
          az version --output json

      - name: Install Google Cloud CLI
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'gcloud'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool gcloud -Destination "$RUNNER_TEMP/google-cloud-cli.deb"
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades "$RUNNER_TEMP/google-cloud-cli.deb"

      - name: Install Terraform
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'terraform'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool terraform -Destination "$RUNNER_TEMP/terraform.zip"
          unzip -qo "$RUNNER_TEMP/terraform.zip" terraform -d "$CLI_TOOLS_ROOT/bin"

      - name: Install Yarn
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'yarn'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool yarn -Destination "$RUNNER_TEMP/yarn.tgz"
          npm install --global --prefix "$CLI_TOOLS_ROOT" --ignore-scripts "$RUNNER_TEMP/yarn.tgz"
          # Yarn Berry needs a project context for help output.
          mkdir -p "$RUNNER_TEMP/yarn-context"
          echo '{"name":"temp"}' > "$RUNNER_TEMP/yarn-context/package.json"
          cd "$RUNNER_TEMP/yarn-context"
          "$CLI_TOOLS_ROOT/bin/yarn" --version
        env:
          # Set default Yarn context for subsequent commands
          YARN_IGNORE_CWD: "true"

      - name: Install AWS CLI
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'aws'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool aws -Destination "$RUNNER_TEMP/awscliv2.zip"
          mkdir -p "$RUNNER_TEMP/aws-installer"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP/aws-installer"
          "$RUNNER_TEMP/aws-installer/aws/install" --install-dir "$CLI_TOOLS_ROOT/aws-cli" --bin-dir "$CLI_TOOLS_ROOT/bin"
          bash tools/ModularPipelines.OptionsGenerator/scripts/aws-help-renderer/Test-AwsHelpRenderer.sh

      - name: Install Kustomize
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'kustomize'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool kustomize -Destination "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$CLI_TOOLS_ROOT/bin" kustomize

      - name: Install Trivy
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'trivy'
        run: |
          TRIVY_ARCHIVE="$RUNNER_TEMP/trivy.tar.gz"
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -O "$TRIVY_ARCHIVE"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $TRIVY_ARCHIVE" | sha256sum --check
          tar -xzf "$TRIVY_ARCHIVE" -C "$CLI_TOOLS_ROOT/bin" trivy
          chmod +x "$CLI_TOOLS_ROOT/bin/trivy"

      - name: Install Hadolint
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'hadolint'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool hadolint -Destination "$CLI_TOOLS_ROOT/bin/hadolint"
          chmod +x "$CLI_TOOLS_ROOT/bin/hadolint"

      - name: Install Flyway
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'flyway'
        run: |
          FLYWAY_ARCHIVE="$RUNNER_TEMP/flyway-commandline-10.20.1-linux-x64.tar.gz"
          wget -q \
            https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/10.20.1/flyway-commandline-10.20.1-linux-x64.tar.gz \
            -O "$FLYWAY_ARCHIVE"
          echo "5fe89b33fd3d91aabbaf3d9b6d35f9a1d5ee28c473148b2435a0cfbe8904245c  $FLYWAY_ARCHIVE" | sha256sum --check
          tar xzf "$FLYWAY_ARCHIVE" -C "$CLI_TOOLS_ROOT"
          ln -s "$CLI_TOOLS_ROOT/flyway-10.20.1/flyway" "$CLI_TOOLS_ROOT/bin/flyway"

      - name: Install Go
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Install Maven
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'mvn'
        run: |
          MAVEN_VERSION=3.9.16
          MAVEN_ARCHIVE="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          MAVEN_PATH="$RUNNER_TEMP/$MAVEN_ARCHIVE"
          wget -q "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/${MAVEN_ARCHIVE}" -O "$MAVEN_PATH"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  ${MAVEN_PATH}" | sha512sum --check
          tar -xzf "$MAVEN_PATH" -C "$CLI_TOOLS_ROOT"
          echo "$CLI_TOOLS_ROOT/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$CLI_TOOLS_ROOT/apache-maven-${MAVEN_VERSION}/bin/mvn" --version

      - name: Install Gradle
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'gradle'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: 9.8.2

      - name: Install Node.js for npm and npx
        if: steps.should-run.outputs.run == 'true' && (matrix.tool == 'npm' || matrix.tool == 'npx')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Install pinned npm and npx
        if: steps.should-run.outputs.run == 'true' && (matrix.tool == 'npm' || matrix.tool == 'npx')
        run: |
          npm_tarball="$RUNNER_TEMP/npm-11.11.0.tgz"
          curl --fail --location --retry 3 https://registry.npmjs.org/npm/-/npm-11.11.0.tgz --output "$npm_tarball"
          test "$(openssl dgst -sha512 -binary "$npm_tarball" | openssl base64 -A)" = "82gRxKrh/eY5UnNorkTFcdBQAGpgjWehkfGVqAGlJjejEtJZGGJUqjo3mbBTNbc5BTnPKGVtGPBZGhElujX5cw=="
          npm install -g --ignore-scripts "$npm_tarball"
          npm --version
          npx --version

      - name: Install pnpm
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'pnpm'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool pnpm -Destination "$RUNNER_TEMP/pnpm.tgz"
          npm install --global --prefix "$CLI_TOOLS_ROOT" --ignore-scripts "$RUNNER_TEMP/pnpm.tgz"

      - name: Install GitHub CLI
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'gh'
        run: |
          # GitHub CLI is pre-installed on ubuntu-latest
          gh --version

      - name: Install SonarScanner
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'sonar-scanner'
        run: |
          SONAR_ARCHIVE="$RUNNER_TEMP/sonar-scanner.zip"
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip -O "$SONAR_ARCHIVE"
          echo "4bd40bf8411ed104853e94a3746ec92bc92845fde2b27dbf5c33fb5cfa8ecbe9  $SONAR_ARCHIVE" | sha256sum --check
          unzip -q "$SONAR_ARCHIVE" -d "$CLI_TOOLS_ROOT"
          ln -s "$CLI_TOOLS_ROOT/sonar-scanner-8.0.1.6346-linux-x64/bin/sonar-scanner" \
            "$CLI_TOOLS_ROOT/bin/sonar-scanner"

      - name: Install Snyk
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'snyk'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool snyk -Destination "$CLI_TOOLS_ROOT/bin/snyk"
          chmod +x "$CLI_TOOLS_ROOT/bin/snyk"

      - name: Install nbgv
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'nbgv'
        run: |
          dotnet tool install --tool-path "$CLI_TOOLS_ROOT/bin" nbgv --version 3.10.94
          nbgv --version

      - name: Install jq
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'jq'
        run: |
          JQ_VERSION=1.8.2
          JQ_SHA256=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
          curl --fail --location --output "$CLI_TOOLS_ROOT/bin/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  $CLI_TOOLS_ROOT/bin/jq" | sha256sum --check --strict
          chmod +x "$CLI_TOOLS_ROOT/bin/jq"
          jq --version

      - name: Install yq
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'yq'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool yq -Destination "$CLI_TOOLS_ROOT/bin/yq"
          chmod +x "$CLI_TOOLS_ROOT/bin/yq"

      # Container tools (Docker alternatives)
      - name: Install Podman
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'podman'
        run: |
          compose_plugin="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          if [[ ! -x "$compose_plugin" ]]; then
            echo "Could not locate the Docker Compose plugin" >&2
            exit 1
          fi
          cp "$compose_plugin" "$CLI_TOOLS_ROOT/bin/docker-compose"
          chmod +x "$CLI_TOOLS_ROOT/bin/docker-compose"
          # Ubuntu's apt package is podman 4.9, which predates `podman artifact` (5.4) and
          # `podman quadlet` (5.6), so regenerating from it shrinks the command set. The
          # runner image no longer ships a newer podman either, so install the current
          # Homebrew bottle and put it ahead of /usr/bin for the remaining steps.
          brew="/home/linuxbrew/.linuxbrew/bin/brew"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 "$brew" install podman
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "PODMAN_COMPOSE_PROVIDER=$CLI_TOOLS_ROOT/bin/docker-compose" >> "$GITHUB_ENV"

      - name: Install Buildah
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'buildah'
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Install Skopeo
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'skopeo'
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      # Infrastructure as Code tools
      - name: Install Pulumi
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'pulumi'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool pulumi -Destination "$RUNNER_TEMP/pulumi.tar.gz"
          tar -xzf "$RUNNER_TEMP/pulumi.tar.gz" -C "$CLI_TOOLS_ROOT" pulumi
          echo "$CLI_TOOLS_ROOT/pulumi" >> "$GITHUB_PATH"

      - name: Install Packer
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'packer'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool packer -Destination "$RUNNER_TEMP/packer.zip"
          unzip -qo "$RUNNER_TEMP/packer.zip" packer -d "$CLI_TOOLS_ROOT/bin"

      - name: Install Vault
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'vault'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool vault -Destination "$RUNNER_TEMP/vault.zip"
          unzip -qo "$RUNNER_TEMP/vault.zip" vault -d "$CLI_TOOLS_ROOT/bin"

      - name: Install Ansible
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'ansible'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Install Liquibase
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'liquibase'
        run: |
          LIQUIBASE_VERSION="5.0.3"
          LIQUIBASE_ROOT="$CLI_TOOLS_ROOT/liquibase"
          LIQUIBASE_ARCHIVE="$RUNNER_TEMP/liquibase.tar.gz"
          mkdir -p "$LIQUIBASE_ROOT"
          wget -q "https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz" -O "$LIQUIBASE_ARCHIVE"
          echo "865aab391be9cbe3fee22461392d5d29aa76652596598b14700a3f5f05c9e2b7  $LIQUIBASE_ARCHIVE" | sha256sum --check
          tar xzf "$LIQUIBASE_ARCHIVE" -C "$LIQUIBASE_ROOT"
          LIQUIBASE_BIN=$(find "$LIQUIBASE_ROOT" -name "liquibase" -type f -executable 2>/dev/null | head -1)
          if [ -z "$LIQUIBASE_BIN" ]; then
            LIQUIBASE_BIN=$(find "$LIQUIBASE_ROOT" -name "liquibase" -type f 2>/dev/null | head -1)
            if [ -n "$LIQUIBASE_BIN" ]; then
              chmod +x "$LIQUIBASE_BIN"
            fi
          fi
          if [ -z "$LIQUIBASE_BIN" ]; then
            echo "Error: Could not find liquibase executable"
            ls -laR "$LIQUIBASE_ROOT"
            exit 1
          fi
          echo "Found liquibase at: $LIQUIBASE_BIN"
          ln -sf "$LIQUIBASE_BIN" "$CLI_TOOLS_ROOT/bin/liquibase"
          liquibase --version

      # Rust ecosystem
      - name: Install Cargo
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'cargo'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool cargo -Destination "$RUNNER_TEMP/cargo.tar.xz"
          tar -xJf "$RUNNER_TEMP/cargo.tar.xz" -C "$CLI_TOOLS_ROOT/bin" --strip-components=3 \
            --wildcards 'cargo-*/cargo/bin/cargo'

      # Kubernetes/GitOps tools
      - name: Install eksctl
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'eksctl'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool eksctl -Destination "$RUNNER_TEMP/eksctl.tar.gz"
          tar -xzf "$RUNNER_TEMP/eksctl.tar.gz" -C "$CLI_TOOLS_ROOT/bin" eksctl

      - name: Install ArgoCD CLI
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'argocd'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool argocd -Destination "$CLI_TOOLS_ROOT/bin/argocd"
          chmod +x "$CLI_TOOLS_ROOT/bin/argocd"

      - name: Install Flux CLI
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'flux'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool flux -Destination "$RUNNER_TEMP/flux.tar.gz"
          tar -xzf "$RUNNER_TEMP/flux.tar.gz" -C "$CLI_TOOLS_ROOT/bin" flux

      # Local Kubernetes tools
      - name: Install Kind
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'kind'
        run: |
          curl -fLo "$CLI_TOOLS_ROOT/bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $CLI_TOOLS_ROOT/bin/kind" | sha256sum --check
          chmod +x "$CLI_TOOLS_ROOT/bin/kind"

      - name: Install Minikube
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'minikube'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool minikube -Destination "$CLI_TOOLS_ROOT/bin/minikube"
          chmod +x "$CLI_TOOLS_ROOT/bin/minikube"

      # Supply chain security tools
      - name: Install Cosign
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'cosign'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool cosign -Destination "$CLI_TOOLS_ROOT/bin/cosign"
          chmod +x "$CLI_TOOLS_ROOT/bin/cosign"
          "$CLI_TOOLS_ROOT/bin/cosign" version

      - name: Install Syft
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'syft'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool syft -Destination "$RUNNER_TEMP/syft.tar.gz"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$CLI_TOOLS_ROOT/bin" syft

      - name: Install Grype
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'grype'
        run: |
          pwsh -NoProfile -File .github/scripts/Get-GenerationTool.ps1 -Tool grype -Destination "$RUNNER_TEMP/grype.tar.gz"
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$CLI_TOOLS_ROOT/bin" grype

      # Code quality tools
      - name: Install ShellCheck
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'shellcheck'
        run: |
          SHELLCHECK_VERSION="0.11.0"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum --check
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$CLI_TOOLS_ROOT/bin/shellcheck"
          shellcheck --version

      # Testing tools
      - name: Install Newman
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'newman'
        run: |
          npm install -g newman

      # Docker is pre-installed on ubuntu-latest
      # .NET CLI is installed via setup-dotnet

      - name: Install pip
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'pip'
        run: |
          # The runner's distro pip can lag behind the generated command surface.
          python3 -m venv "$CLI_TOOLS_ROOT/pip"
          "$CLI_TOOLS_ROOT/pip/bin/python" -m pip install --upgrade pip
          echo "$CLI_TOOLS_ROOT/pip/bin" >> "$GITHUB_PATH"
          "$CLI_TOOLS_ROOT/pip/bin/pip" --version

      - name: Add Homebrew to PATH
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'brew'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Verify affected tool installation
        if: steps.should-run.outputs.run == 'true' && contains(fromJSON('["aws","gh","git","brew","podman","snyk","yarn","cosign","eksctl","trivy","liquibase","pip"]'), matrix.tool)
        run: |
          command -v "${{ matrix.tool }}"
          case "${{ matrix.tool }}" in
            cosign) cosign version ;;
            eksctl) eksctl version ;;
            *) "${{ matrix.tool }}" --version ;;
          esac

      - name: Pin resolved executable for scraper
        if: steps.should-run.outputs.run == 'true'
        run: |
          EXECUTABLE_PATH="$(command -v "${{ matrix.tool }}")"
          if [ -z "$EXECUTABLE_PATH" ]; then
            echo "Could not resolve executable for ${{ matrix.tool }}" >&2
            exit 1
          fi

          # Each matrix job handles one tool. Pin the binary that passed verification so
          # a later PATH mutation cannot redirect the scraper to a runner-preinstalled copy.
          echo "MODULARPIPELINES_CLI_EXECUTABLE=$EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Build Generator
        if: steps.should-run.outputs.run == 'true'
        run: dotnet build -c Release
        working-directory: tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator

      - name: Run Generator for ${{ matrix.tool }}
        id: generator
        if: steps.should-run.outputs.run == 'true'
        env:
          # gh requires authentication even for its local extension inventory.
          GH_TOKEN: ${{ matrix.tool == 'gh' && github.token || '' }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/generator-work"
          COVERAGE_ARGS=()
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs['approve-command-coverage-shrinkage'] || false }}" == "true" ]]; then
            COVERAGE_ARGS+=(--approve-command-coverage-shrinkage)
          fi

          COMMAND_TIMEOUT_SECONDS=30
          if [[ "${{ matrix.tool }}" == "aws" ]]; then
            # Large QuickSight/WAF help pages exceed 30 seconds even without network access.
            COMMAND_TIMEOUT_SECONDS=180
            # AWS invokes groff directly; MANWIDTH/MANOPT do not affect this renderer.
            export MODULARPIPELINES_REAL_GROFF="$(command -v groff)"
            export PATH="$GITHUB_WORKSPACE/tools/ModularPipelines.OptionsGenerator/scripts/aws-help-renderer:$PATH"
            chmod +x "$GITHUB_WORKSPACE/tools/ModularPipelines.OptionsGenerator/scripts/aws-help-renderer/groff"
          fi

          dotnet run \
            --project "$GITHUB_WORKSPACE/tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator/ModularPipelines.OptionsGenerator.csproj" \
            -c Release -- \
            --tools "${{ matrix.tool }}" \
            --output-dir "$GITHUB_WORKSPACE" \
            --change-manifest "$RUNNER_TEMP/generated-paths.txt" \
            --command-timeout-seconds "$COMMAND_TIMEOUT_SECONDS" \
            "${COVERAGE_ARGS[@]}" | tee "$RUNNER_TEMP/generator-output.log"

          if ! grep -Eq -- '- Files generated: [1-9][0-9]*$' "$RUNNER_TEMP/generator-output.log"; then
            echo "Generator produced zero files for ${{ matrix.tool }}" >&2
            exit 1
          fi

      - name: Upload scrape failure diagnostics
        if: always() && steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: options-generator-diagnostics-${{ matrix.tool }}-${{ runner.os }}
          path: artifacts/options-generator-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Prune obsolete generated Git options
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'git'
        shell: pwsh
        run: |
          tools/ModularPipelines.OptionsGenerator/scripts/Remove-UnrecognizedCommandOptions.ps1 `
            -Tool "${{ matrix.tool }}" `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -PackageDirectory "${{ matrix.outputDirectory }}" `
            -NamespacePrefix "${{ matrix.prefix }}" `
            -ChangeManifest "$env:RUNNER_TEMP/generated-paths.txt"

      - name: Record generator provenance
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        run: |
          scripts/Write-GeneratedOptionsProvenance.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -Tool "${{ matrix.tool }}" `
            -PackageDirectory "${{ matrix.outputDirectory }}" `
            -NamespacePrefix "${{ matrix.prefix }}" `
            -ChangeManifest "$env:RUNNER_TEMP/generated-paths.txt"

      - name: Check for changes
        if: steps.should-run.outputs.run == 'true'
        id: changes
        shell: pwsh
        run: |
          tools/ModularPipelines.OptionsGenerator/scripts/Stage-GeneratedChanges.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -ManifestPath "$env:RUNNER_TEMP/generated-paths.txt" `
            -AllowedPathFile "$env:RUNNER_TEMP/legacy-generated-paths.txt" `
            -MaximumFileSizeBytes 26214400

          # Check for actual content changes (ignore whitespace-only changes)
          git diff --staged --quiet --ignore-all-space --ignore-blank-lines
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -gt 1) {
            throw "git diff failed with exit code $diffExitCode."
          }

          $hasChanges = $diffExitCode -eq 1
          $global:LASTEXITCODE = 0
          if ($hasChanges) {
            "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            $stagedPaths = @(git diff --staged --name-only)
            Write-Host "Changed files:"
            $stagedPaths
          } else {
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No meaningful changes detected for ${{ matrix.tool }}"
          }

      - name: Preserve generated CLI patch
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GENERATION_TOOL: ${{ matrix.tool }}
        run: git diff --staged --binary --output="$RUNNER_TEMP/generated-${GENERATION_TOOL}.patch"

      - name: Upload generated CLI patch
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-${{ matrix.tool }}-patch
          path: ${{ runner.temp }}/generated-${{ matrix.tool }}.patch
          retention-days: 7

      - name: Increase swap space for Gcloud build
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'gcloud' && steps.changes.outputs.has_changes == 'true'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Build solution to verify changes
        if: steps.should-run.outputs.run == 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          BUILD_ARGS=()
          # Large generated packages need bounded MSBuild concurrency on hosted runners.
          if [[ "${{ matrix.tool }}" == "gcloud" || "${{ matrix.tool }}" == "aws" ]]; then
            BUILD_ARGS+=(/m:1 -p:UseSharedCompilation=false)
          fi
          dotnet build "src/${{ steps.package.outputs.package }}/${{ steps.package.outputs.package }}.slnx" \
            -c Release "${BUILD_ARGS[@]}"

      - name: Test generated Azure contracts
        if: steps.should-run.outputs.run == 'true' && steps.changes.outputs.has_changes == 'true' && matrix.tool == 'az'
        run: >-
          dotnet run
          --project test/ModularPipelines.Azure.UnitTests/ModularPipelines.Azure.UnitTests.csproj
          --framework net11.0 --configuration Release --no-build

      - name: Test generated Python contracts
        if: steps.should-run.outputs.run == 'true' && steps.changes.outputs.has_changes == 'true' && matrix.tool == 'pip'
        run: >-
          dotnet run
          --project test/ModularPipelines.Python.UnitTests/ModularPipelines.Python.UnitTests.csproj
          --framework net11.0 --configuration Release --no-build

      # Only successful generation and validation may hand data to the trusted publisher.
      - name: Revalidate generated changes before handoff
        if: steps.changes.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          tools/ModularPipelines.OptionsGenerator/scripts/Stage-GeneratedChanges.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -ManifestPath "$env:RUNNER_TEMP/generated-paths.txt" `
            -AllowedPathFile "$env:RUNNER_TEMP/legacy-generated-paths.txt" `
            -MaximumFileSizeBytes 26214400

      - name: Export publication data
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        env:
          GENERATION_HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          GENERATION_TOOL: ${{ matrix.tool }}
          GENERATION_PREFIX: ${{ matrix.prefix }}
          GENERATION_PACKAGE_DIRECTORY: ${{ matrix.outputDirectory }}
          GENERATION_COMMAND_FACADE: ${{ matrix.generateCommandFacade }}
          GENERATION_SOURCE_SHA: ${{ github.sha }}
          GENERATION_MAX_FILE_BYTES: 26214400
        run: >-
          node .github/scripts/generation-artifact.mjs export
          "$env:RUNNER_TEMP/publication-data" "$env:RUNNER_TEMP/generator-output.log"

      - name: Upload publication data
        if: steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-${{ matrix.tool }}-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-data/generated-options.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Generate options for Windows-only tools
  generate-windows:
    name: Generate ${{ matrix.tool }}
    needs:
      - validate-generation-safety
      - tool-catalog
    if: needs.tool-catalog.outputs.windows-count != '0'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tool-catalog.outputs.windows) }}
    concurrency:
      group: ${{ github.workflow }}-generated-refresh-${{ matrix.tool }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check if tool should run
        id: should-run
        shell: pwsh
        run: '"run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Checkout
        if: steps.should-run.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        if: steps.should-run.outputs.run == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet
        if: steps.should-run.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare isolated CLI workspace
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        run: |
          $cliToolsRoot = Join-Path $env:RUNNER_TEMP 'cli-tools'
          $generatorWork = Join-Path $env:RUNNER_TEMP 'generator-work'
          New-Item -ItemType Directory -Force (Join-Path $cliToolsRoot 'bin') | Out-Null
          New-Item -ItemType Directory -Force $generatorWork | Out-Null
          if ('${{ matrix.tool }}' -eq 'dotnet') {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'global.json') `
              -Destination (Join-Path $generatorWork 'global.json')
          }
          "CLI_TOOLS_ROOT=$cliToolsRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $cliToolsRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append

      # Clean up legacy manual files before generation
      # Only delete specific service interface/implementation files that will be replaced
      - name: Clean up legacy files
        id: package
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        run: |
          $package = "${{ matrix.package }}"
          $prefix = "${{ matrix.prefix }}"
          $pkgDir = "${{ matrix.outputDirectory }}"
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Cleaning up legacy files in $pkgDir for prefix $prefix..."
          $legacyPaths = Join-Path $env:RUNNER_TEMP 'legacy-generated-paths.txt'
          Set-Content -LiteralPath $legacyPaths -Value ''

          function Remove-LegacyFile([string] $path) {
            if (Test-Path -LiteralPath $path) {
              Add-Content -LiteralPath $legacyPaths -Value $path
              Remove-Item -LiteralPath $path -Force
              Write-Host "Removed $path"
            }
          }

          # Preserve handwritten service APIs during coverage-only generator runs.
          if ('${{ matrix.generateCommandFacade }}' -eq 'true') {
            # Only delete specific service interface/implementation files (not all I*.cs files)
            # These are the exact files the generator will create in Services/
            $interfaceFile = Join-Path $pkgDir "I$prefix.cs"
            $implFile = Join-Path $pkgDir "$prefix.cs"

            Remove-LegacyFile $interfaceFile
            Remove-LegacyFile $implFile

            # Keep generated service files until generation succeeds. They are the API
            # baseline used to restore commands that disappeared from newer CLI help,
            # and successful generation overwrites these exact paths atomically.
          }

          Write-Host "Cleanup complete for $package"

      - name: Install Chocolatey
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'choco'
        shell: pwsh
        run: |
          # Chocolatey is pre-installed on windows-latest
          choco --version

      - name: Install WinGet
        if: steps.should-run.outputs.run == 'true' && matrix.tool == 'winget'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Microsoft.DesktopAppInstaller.msixbundle'
          $dependencies = Join-Path $env:RUNNER_TEMP 'winget-dependencies.zip'
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'winget-dependencies'
          & .github/scripts/Get-GenerationTool.ps1 -Tool winget -Destination $bundle
          & .github/scripts/Get-GenerationTool.ps1 -Tool winget-dependencies -Destination $dependencies
          Expand-Archive -LiteralPath $dependencies -DestinationPath $dependencyRoot
          # Appx must bind dependency arrays inside Windows PowerShell, without its compatibility proxy.
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/Test-GenerationWinGet.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WinGet registration tests failed.' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/Install-GenerationWinGet.ps1 -Bundle $bundle -DependencyRoot $dependencyRoot
          if ($LASTEXITCODE -ne 0) { throw 'WinGet package registration failed.' }
          $windowsApps = Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps'
          $windowsApps | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$windowsApps;$env:PATH"
          winget --version

      - name: Pin resolved executable for scraper
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        run: |
          $command = Get-Command "${{ matrix.tool }}" -ErrorAction Stop
          # Each matrix job handles one tool. Pin the binary that passed verification so
          # a later PATH mutation cannot redirect the scraper to a runner-preinstalled copy.
          "MODULARPIPELINES_CLI_EXECUTABLE=$($command.Source)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Generator
        if: steps.should-run.outputs.run == 'true'
        run: dotnet build -c Release
        working-directory: tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator

      - name: Run Generator for ${{ matrix.tool }}
        id: generator
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'generator-work')
          $generatorProject = Join-Path $env:GITHUB_WORKSPACE `
            'tools/ModularPipelines.OptionsGenerator/src/ModularPipelines.OptionsGenerator/ModularPipelines.OptionsGenerator.csproj'
          $coverageArgs = @()
          if ("${{ github.event_name == 'workflow_dispatch' && inputs['approve-command-coverage-shrinkage'] || false }}" -eq "true") {
            $coverageArgs += "--approve-command-coverage-shrinkage"
          }

          $generatorOutput = @(dotnet run --project $generatorProject -c Release -- `
            --tools "${{ matrix.tool }}" `
            --output-dir "$env:GITHUB_WORKSPACE" `
            --change-manifest "$env:RUNNER_TEMP/generated-paths.txt" `
            @coverageArgs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/generator-output.log")
          $generatorOutput | Write-Host

          if ($LASTEXITCODE -ne 0) {
            throw "Generator failed for ${{ matrix.tool }}"
          }

          if (-not ($generatorOutput | Select-String -Pattern '- Files generated: [1-9][0-9]*' -Quiet)) {
            throw "Generator produced zero files for ${{ matrix.tool }}"
          }

      - name: Upload scrape failure diagnostics
        if: always() && steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: options-generator-diagnostics-${{ matrix.tool }}-${{ runner.os }}
          path: artifacts/options-generator-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Record generator provenance
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        run: |
          scripts/Write-GeneratedOptionsProvenance.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -Tool "${{ matrix.tool }}" `
            -PackageDirectory "${{ matrix.outputDirectory }}" `
            -NamespacePrefix "${{ matrix.prefix }}" `
            -ChangeManifest "$env:RUNNER_TEMP/generated-paths.txt"

      - name: Check for changes
        if: steps.should-run.outputs.run == 'true'
        id: changes
        shell: pwsh
        run: |
          tools/ModularPipelines.OptionsGenerator/scripts/Stage-GeneratedChanges.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -ManifestPath "$env:RUNNER_TEMP/generated-paths.txt" `
            -AllowedPathFile "$env:RUNNER_TEMP/legacy-generated-paths.txt" `
            -MaximumFileSizeBytes 5242880

          # Check for actual content changes (ignore whitespace-only changes)
          git diff --staged --quiet --ignore-all-space --ignore-blank-lines
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -gt 1) {
            throw "git diff failed with exit code $diffExitCode."
          }
          $hasChanges = $diffExitCode -eq 1
          $global:LASTEXITCODE = 0
          if ($hasChanges) {
            "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            $stagedPaths = @(git diff --staged --name-only)
            Write-Host "Changed files:"
            $stagedPaths
          } else {
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No meaningful changes detected for ${{ matrix.tool }}"
          }

      - name: Preserve generated CLI patch
        if: steps.changes.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GENERATION_TOOL: ${{ matrix.tool }}
        run: git diff --staged --binary --output="$env:RUNNER_TEMP/generated-${env:GENERATION_TOOL}.patch"

      - name: Upload generated CLI patch
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-${{ matrix.tool }}-patch
          path: ${{ runner.temp }}/generated-${{ matrix.tool }}.patch
          retention-days: 7

      - name: Build solution to verify changes
        if: steps.should-run.outputs.run == 'true' && steps.changes.outputs.has_changes == 'true'
        run: >-
          dotnet build
          "src/${{ steps.package.outputs.package }}/${{ steps.package.outputs.package }}.slnx"
          -c Release

      # Only successful generation and validation may hand data to the trusted publisher.
      - name: Revalidate generated changes before handoff
        if: steps.changes.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          tools/ModularPipelines.OptionsGenerator/scripts/Stage-GeneratedChanges.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -ManifestPath "$env:RUNNER_TEMP/generated-paths.txt" `
            -AllowedPathFile "$env:RUNNER_TEMP/legacy-generated-paths.txt" `
            -MaximumFileSizeBytes 5242880

      - name: Export publication data
        if: steps.should-run.outputs.run == 'true'
        shell: pwsh
        env:
          GENERATION_HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          GENERATION_TOOL: ${{ matrix.tool }}
          GENERATION_PREFIX: ${{ matrix.prefix }}
          GENERATION_PACKAGE_DIRECTORY: ${{ matrix.outputDirectory }}
          GENERATION_COMMAND_FACADE: ${{ matrix.generateCommandFacade }}
          GENERATION_SOURCE_SHA: ${{ github.sha }}
          GENERATION_MAX_FILE_BYTES: 5242880
        run: >-
          node .github/scripts/generation-artifact.mjs export
          "$env:RUNNER_TEMP/publication-data" "$env:RUNNER_TEMP/generator-output.log"

      - name: Upload publication data
        if: steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-${{ matrix.tool }}-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-data/generated-options.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Fresh hosted runners execute only checked-in publication helpers and actions.
  # The PAT is supplied only to PR operations; no downloaded tool, build, or cache runs here.
  publish:
    needs: [tool-catalog, generate, generate-windows]
    if: >-
      always() && !cancelled() && needs.tool-catalog.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tool-catalog.outputs.publication) }}
    concurrency:
      group: ${{ github.workflow }}-generated-publication-${{ matrix.tool }}
      cancel-in-progress: false
      queue: max
    env:
      GENERATION_TOOL: ${{ matrix.tool }}
      GENERATION_PREFIX: ${{ matrix.prefix }}
      GENERATION_PACKAGE_DIRECTORY: ${{ matrix.outputDirectory }}
      GENERATION_COMMAND_FACADE: ${{ matrix.generateCommandFacade }}
      GENERATION_SOURCE_SHA: ${{ github.sha }}
      GENERATION_MAX_FILE_BYTES: ${{ matrix.maximumFileSizeBytes }}

    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find successful tool handoff
        id: artifact
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
            > "$RUNNER_TEMP/generation-jobs.json"
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/generation-artifacts.json"
          node .github/scripts/generation-artifact.mjs select \
            "$RUNNER_TEMP/generation-jobs.json" "$RUNNER_TEMP/generation-artifacts.json"

      - name: Download generated data outside checkout
        if: steps.artifact.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ runner.temp }}/publication-data
          merge-multiple: true

      - name: Validate and import generated data
        if: steps.artifact.outputs.id != ''
        id: handoff
        env:
          GENERATION_MANIFEST: ${{ runner.temp }}/publication-paths.txt
          GENERATION_RUN_ATTEMPT: ${{ steps.artifact.outputs.run_attempt }}
        run: node .github/scripts/generation-artifact.mjs import "$RUNNER_TEMP/publication-data"

      - name: Validate provenance and stage exact generated paths
        if: steps.handoff.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GENERATION_MANIFEST: ${{ runner.temp }}/publication-paths.txt
          GENERATION_PACKAGE: ${{ matrix.package }}
          GENERATION_SOURCE_REF: ${{ github.ref_name }}
        run: |
          ./scripts/Assert-GeneratedOptionsFreshness.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Tool $env:GENERATION_TOOL `
            -Package $env:GENERATION_PACKAGE `
            -NamespacePrefix $env:GENERATION_PREFIX `
            -CurrentBase "origin/$($env:GENERATION_SOURCE_REF)"
          tools/ModularPipelines.OptionsGenerator/scripts/Stage-GeneratedChanges.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ManifestPath $env:GENERATION_MANIFEST `
            -MaximumFileSizeBytes $env:GENERATION_MAX_FILE_BYTES

      - name: Resolve generated output branch
        if: steps.handoff.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GENERATION_SOURCE_REF: ${{ github.ref_name }}
          GENERATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $branch = ./scripts/Get-GeneratedOptionsBranch.ps1 `
            -Tool $env:GENERATION_TOOL `
            -SourceRef $env:GENERATION_SOURCE_REF `
            -DefaultBranch $env:GENERATION_DEFAULT_BRANCH
          "GENERATED_OPTIONS_BRANCH=$branch" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Disable inherited auto-merge
        if: steps.handoff.outputs.has_changes == 'true' && github.event.inputs.create-pr != 'false'
        env:
          GH_TOKEN: ${{ secrets.CLI_SCRAPER_PAT_TOKEN }}
        run: |
          pr_number="$(gh pr list --state open --head "$GENERATED_OPTIONS_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            auto_merge_enabled="$(gh pr view "$pr_number" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$auto_merge_enabled" = "true" ]; then
              gh pr merge "$pr_number" --disable-auto
            fi
          fi

      - name: Create Pull Request for ${{ matrix.tool }}
        id: create-pr
        if: steps.handoff.outputs.has_changes == 'true' && github.event.inputs.create-pr != 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CLI_SCRAPER_PAT_TOKEN }}
          commit-message: "chore: Update ${{ matrix.tool }} CLI options"
          title: "[Automated] Update ${{ matrix.tool }} CLI Options"
          body: |
            ## Summary
            This PR contains automatically generated updates to **${{ matrix.tool }}** CLI options classes.

            The generator scraped the latest CLI help output from the installed tool.

            ## Changes
            - Updated options classes to reflect latest CLI documentation
            - Added new commands if any were detected
            - Updated option types and descriptions

            ## Command coverage
            ${{ steps.handoff.outputs.coverage-report }}

            ## Verification
            - [x] Solution builds successfully in the read-only generation job

            Review the generated output and all required checks before merging manually.

            ---
            🤖 Generated with ModularPipelines.OptionsGenerator
          branch: ${{ env.GENERATED_OPTIONS_BRANCH }}
          # Keep feature-branch output on the source ref that produced it.
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: |
            automated
            dependencies
          author: thomhurst <9139608+thomhurst@users.noreply.github.com>
          committer: thomhurst <9139608+thomhurst@users.noreply.github.com>

  report-scheduled-failure:
    name: Report scheduled failure
    if: >-
      ${{
        always()
        && github.event_name == 'schedule'
        && (
          needs.validate-generation-safety.result == 'failure'
          || needs.validate-generation-safety.result == 'cancelled'
          || needs.tool-catalog.result == 'failure'
          || needs.tool-catalog.result == 'cancelled'
          || needs.generate.result == 'failure'
          || needs.generate.result == 'cancelled'
          || needs.generate-windows.result == 'failure'
          || needs.generate-windows.result == 'cancelled'
          || needs.publish.result == 'failure'
          || needs.publish.result == 'cancelled'
        )
      }}
    needs:
      - validate-generation-safety
      - tool-catalog
      - generate
      - generate-windows
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Generate CLI Options scheduled run failed
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE_RESULT: ${{ needs.validate-generation-safety.result }}
          CATALOG_RESULT: ${{ needs.tool-catalog.result }}
          LINUX_RESULT: ${{ needs.generate.result }}
          WINDOWS_RESULT: ${{ needs.generate-windows.result }}
          PUBLICATION_RESULT: ${{ needs.publish.result }}
        run: |
          issue_body="$(cat <<EOF
          Scheduled CLI option generation failed.

          - Run: $RUN_URL
          - Generation safety: $VALIDATE_RESULT
          - Tool catalog: $CATALOG_RESULT
          - Linux generation: $LINUX_RESULT
          - Windows generation: $WINDOWS_RESULT
          - Publication: $PUBLICATION_RESULT

          Inspect failed matrix jobs and keep this issue open until a scheduled run succeeds.
          EOF
          )"

          existing_issue="$(
            gh issue list \
              --state open \
              --search "$ISSUE_TITLE in:title" \
              --limit 10 \
              --json number,title \
              --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" |
              head -n 1
          )"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body "$issue_body"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$issue_body" \
              --label bug
          fi
