name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - '.github/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'docs/**/*.js'
      - 'docs/**/*.jsx'
      - 'docs/**/*.ts'
      - 'docs/**/*.tsx'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'docs/**/*.js'
      - 'docs/**/*.jsx'
      - 'docs/**/*.ts'
      - 'docs/**/*.tsx'
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_generated_integration: ${{ steps.generated_integration.outputs.is_generated_integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: generated_integration
        uses: ./.github/actions/detect-generated-integration

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: classify
    # Generated snapshots receive focused compilation in .NET; main and scheduled scans remain complete.
    if: needs.classify.outputs.is_generated_integration != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - csharp
          - javascript-typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        if: matrix.language == 'csharp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-codeql-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-codeql-
            ${{ runner.os }}-nuget-
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          db-location: ${{ runner.temp }}/codeql-databases
      - name: Restore core solution
        if: matrix.language == 'csharp'
        run: dotnet restore ModularPipelines.slnx
      - name: Select C# framework references
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkVersion = [version](Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $framework = "net$($sdkVersion.Major).0"
          $references = foreach ($pack in @('Microsoft.NETCore.App.Ref', 'Microsoft.AspNetCore.App.Ref')) {
            $version = Get-ChildItem (Join-Path $env:DOTNET_ROOT "packs/$pack") -Directory |
              Where-Object { $_.Name -match "^$($sdkVersion.Major)\.0\.\d+$" } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1
            if (-not $version) { throw "Missing $pack for $framework" }
            $path = Join-Path $version.FullName "ref/$framework"
            if (-not (Test-Path $path -PathType Container)) { throw "Missing reference directory: $path" }
            Write-Host "CodeQL framework references: $path"
            $path
          }
          # Buildless extraction combines projects. Keep framework metadata coherent
          # instead of resolving competing framework versions from restored packages.
          "CODEQL_EXTRACTOR_CSHARP_BUILDLESS_DOTNET_FRAMEWORK_REFERENCES=$($references -join [IO.Path]::PathSeparator)" >> $env:GITHUB_ENV
          'CODEQL_EXTRACTOR_CSHARP_OPTION_LOGGING_VERBOSITY=debug' >> $env:GITHUB_ENV
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: failure-only
      - name: Upload results
        id: upload
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          sarif_file: ${{ runner.temp }}/codeql-results
      - name: Retry results upload
        if: steps.upload.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          sarif_file: ${{ runner.temp }}/codeql-results
      - name: Preserve C# extraction diagnostics
        if: failure() && matrix.language == 'csharp'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-csharp-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-databases/csharp/log
            ${{ runner.temp }}/codeql-databases/csharp/diagnostic
          if-no-files-found: warn
          retention-days: 14
