name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - '.github/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'docs/**/*.js'
      - 'docs/**/*.jsx'
      - 'docs/**/*.ts'
      - 'docs/**/*.tsx'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'docs/**/*.js'
      - 'docs/**/*.jsx'
      - 'docs/**/*.ts'
      - 'docs/**/*.tsx'
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - csharp
          - javascript-typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        if: matrix.language == 'csharp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-codeql-${{ hashFiles('**/*.csproj', '**/*.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-codeql-
            ${{ runner.os }}-nuget-
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Restore core solution
        if: matrix.language == 'csharp'
        run: dotnet restore ModularPipelines.slnx
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: failure-only
      - name: Upload results
        id: upload
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
          sarif_file: ${{ runner.temp }}/codeql-results
      - name: Retry results upload
        if: steps.upload.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
          sarif_file: ${{ runner.temp }}/codeql-results
