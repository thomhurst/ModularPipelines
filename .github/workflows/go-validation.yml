name: Go validation

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: go-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Go build, tests and formatting
    # The caller routes changes and skips drafts before invoking this workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build Go solution
        run: dotnet build src/ModularPipelines.Go/ModularPipelines.Go.slnx -c Release
      - name: Run Go tests
        run: dotnet run --project test/ModularPipelines.Go.UnitTests/ModularPipelines.Go.UnitTests.csproj -c Release --framework net11.0 --no-build
      - name: Verify Go formatting
        run: >-
          dotnet format src/ModularPipelines.Go/ModularPipelines.Go.slnx
          --no-restore --verify-no-changes --severity info
          --include src/ModularPipelines.Go test/ModularPipelines.Go.UnitTests
